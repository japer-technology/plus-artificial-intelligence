<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="The +AI specification as a cinematic opening crawl.">
  <title>+AI — Opening Crawl</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400&display=swap">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      color: #f3edd9;
      background: #000000;
      font-family: "EB Garamond", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, "Times New Roman", serif;
      text-rendering: optimizeLegibility;
    }

    [hidden] {
      display: none !important;
    }

    button,
    select {
      font: inherit;
      color: inherit;
    }

    :focus-visible {
      outline: 0.2rem solid #e4c15a;
      outline-offset: 0.2rem;
    }

    /* ---------------------------------------------------------------- stage */

    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 115%, rgba(212, 175, 55, 0.10), transparent 62%),
        #000000;
    }

    /* Two layers of tiny radial-gradient stars. */
    .stars {
      position: absolute;
      inset: -2%;
      background-repeat: repeat;
      pointer-events: none;
    }

    .stars-1 {
      background-image:
        radial-gradient(1px 1px at 25px 35px, rgba(255, 255, 255, 0.90), transparent 60%),
        radial-gradient(1px 1px at 120px 80px, rgba(255, 255, 255, 0.55), transparent 60%),
        radial-gradient(1.5px 1.5px at 200px 160px, rgba(255, 255, 255, 0.50), transparent 60%),
        radial-gradient(1px 1px at 70px 210px, rgba(255, 255, 255, 0.70), transparent 60%),
        radial-gradient(1px 1px at 260px 40px, rgba(255, 255, 255, 0.55), transparent 60%),
        radial-gradient(1px 1px at 150px 290px, rgba(255, 255, 255, 0.45), transparent 60%);
      background-size: 300px 240px;
      animation: twinkle 6s ease-in-out infinite alternate;
    }

    .stars-2 {
      background-image:
        radial-gradient(2px 2px at 50px 60px, rgba(255, 244, 214, 0.90), transparent 60%),
        radial-gradient(1.5px 1.5px at 180px 150px, rgba(255, 255, 255, 0.80), transparent 60%),
        radial-gradient(2px 2px at 90px 20px, rgba(255, 230, 170, 0.70), transparent 60%),
        radial-gradient(1.5px 1.5px at 240px 200px, rgba(255, 255, 255, 0.75), transparent 60%),
        radial-gradient(1px 1px at 310px 90px, rgba(255, 255, 255, 0.60), transparent 60%);
      background-size: 420px 320px;
      animation: twinkle 9s ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      from { opacity: 0.5; }
      to { opacity: 1; }
    }

    .haze {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 12%;
      height: 42%;
      background: radial-gradient(ellipse at 50% 100%, rgba(212, 175, 55, 0.14), transparent 70%);
      pointer-events: none;
    }

    /* ------------------------------------------------------- crawling plane */

    .crawl-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      perspective: 1600px;
      perspective-origin: 50% 15%;
    }

    /* The plane starts fully visible (title on screen) and recedes upward,
       shrinking gently to fake distance. A hard 3D tilt of a ~3000px-tall
       plane crossed the camera plane with the old 400px perspective and
       destroyed readability, so the recede is done with scale instead. */
    .crawl {
      width: min(44rem, 90vw);
      transform: translateY(0) scale(1);
      transform-origin: 50% 0%;
      text-align: start;
      animation: crawl var(--duration, 120s) linear forwards;
      animation-play-state: running;
      will-change: transform;
    }

    @keyframes crawl {
      0% { transform: translateY(10vh) scale(1); }
      100% { transform: translateY(-100%) scale(0.7); }
    }

    /* ------------------------------------------------------------ text blocks */

    .crawl-block {
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.65);
    }

    .title-card {
      margin-bottom: 7rem;
      color: #f6ead0;
      font-size: clamp(4rem, 15vw, 9.5rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
      text-align: center;
      text-shadow: 0 0 30px rgba(212, 175, 55, 0.55), 0 0 90px rgba(212, 175, 55, 0.28);
    }

    .crawl-note {
      margin: 1.5rem 0 5rem;
      color: #b9a45c;
      font-size: clamp(0.85rem, 2.2vw, 1.15rem);
      letter-spacing: 0.08em;
    }

    .crawl-head {
      margin-top: 4.5rem;
      color: #e4c15a;
      font-size: clamp(1.5rem, 4vw, 2.6rem);
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-shadow: 0 0 18px rgba(212, 175, 55, 0.35);
    }

    .crawl-sub {
      margin-top: 1.8rem;
      color: #e8cf82;
      font-size: clamp(1.35rem, 3.6vw, 2.3rem);
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .crawl-p {
      margin: 0.85rem 0;
      color: #f3edd9;
      font-size: clamp(1.25rem, 3.4vw, 2.1rem);
      line-height: 1.55;
    }

    .crawl-li {
      margin: 0.4rem 0;
      color: #e6dfc8;
      font-size: clamp(1.1rem, 3vw, 1.8rem);
      line-height: 1.5;
    }

    .crawl-pre {
      max-width: 92%;
      margin: 1.2rem auto;
      padding: 0.75rem 1rem;
      color: #cfe0d8;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 0.4rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: clamp(0.85rem, 2.2vw, 1.25rem);
      line-height: 1.5;
      white-space: pre;
      text-align: start;
      overflow-x: auto;
    }

    .crawl-end {
      margin: 1.4rem 0 0;
      color: #f3edd9;
      font-size: clamp(1.3rem, 3.4vw, 2.2rem);
      line-height: 1.4;
    }

    .crawl-final {
      margin-top: 6rem;
      color: #f0d98a;
      font-size: clamp(1.8rem, 5vw, 3.4rem);
      font-weight: 700;
      letter-spacing: 0.16em;
      line-height: 1.2;
      text-align: center;
      text-transform: uppercase;
      text-shadow: 0 0 26px rgba(212, 175, 55, 0.5);
    }

    /* --------------------------------------------- static reduced-motion list */

    .static {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 6rem 1rem 6rem;
      overflow-y: auto;
      scrollbar-color: rgba(212, 175, 55, 0.4) transparent;
    }

    .static-list {
      width: min(44rem, 92vw);
      text-align: start;
    }

    .static-list .crawl-head {
      margin-top: 3.5rem;
    }

    .static-list .title-card {
      margin-bottom: 3rem;
    }

    .static-list .crawl-final {
      margin-top: 4rem;
    }

    /* ----------------------------------------------------------- controls bar */

    .controls {
      position: fixed;
      z-index: 20;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      padding: max(0.5rem, env(safe-area-inset-top)) 0.5rem 0.5rem;
      background: linear-gradient(rgba(0, 0, 0, 0.86), rgba(0, 0, 0, 0.55));
      border-bottom: 1px solid rgba(212, 175, 55, 0.22);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .controls-inner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: min(100%, 84rem);
    }

    .brand {
      margin-inline-end: 0.4rem;
      color: #f0d98a;
      font-weight: 700;
      font-size: 1.3rem;
      letter-spacing: -0.06em;
      line-height: 1;
    }

    .ctl {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .ctl > span {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #b9a45c;
    }

    .controls select,
    .controls button {
      min-height: 2.1rem;
      padding: 0.35rem 0.6rem;
      color: #f3edd9;
      background: rgba(20, 16, 8, 0.72);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 0.4rem;
      cursor: pointer;
      transition: border-color 150ms ease, background-color 150ms ease;
    }

    .controls select {
      min-width: 9.5rem;
      max-width: 11rem;
    }

    .controls button {
      font-size: 0.8rem;
      letter-spacing: 0.04em;
    }

    .controls select:hover,
    .controls button:hover {
      border-color: rgba(212, 175, 55, 0.8);
    }

    .controls button.active {
      color: #17130a;
      background: #e4c15a;
      border-color: #e4c15a;
    }

    .controls select option {
      color: #f3edd9;
      background: #0d0b06;
    }

    .transport {
      gap: 0.3rem;
    }

    html.reduced .transport {
      display: none;
    }

    /* ---------------------------------------------------------- reduced motion */

    @media (prefers-reduced-motion: reduce) {
      .stars-1,
      .stars-2 {
        animation: none !important;
      }

      .crawl {
        animation: none !important;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="stars stars-1" aria-hidden="true"></div>
    <div class="stars stars-2" aria-hidden="true"></div>
    <div class="haze" aria-hidden="true"></div>

    <div class="crawl-wrap" id="crawlWrap">
      <div class="crawl" id="crawl"></div>
    </div>

    <div class="static" id="staticWrap" hidden>
      <div class="static-list" id="staticList" tabindex="0"></div>
    </div>
  </div>

  <header class="controls">
    <div class="controls-inner">
      <span class="brand" aria-hidden="true">+AI</span>

      <label class="ctl">
        <span>Language</span>
        <select id="langSelect" aria-label="Choose language"></select>
      </label>

      <div class="ctl transport" role="group" aria-label="Playback speed">
        <button type="button" class="speed" data-speed="0.5" aria-label="Half speed">0.5×</button>
        <button type="button" class="speed" data-speed="1" aria-label="Normal speed">1×</button>
        <button type="button" class="speed" data-speed="1.5" aria-label="One and a half speed">1.5×</button>
      </div>

      <div class="ctl transport" role="group" aria-label="Playback">
        <button type="button" id="playPause" aria-label="Pause the crawl">Pause</button>
        <button type="button" id="restart" aria-label="Restart the crawl">Restart</button>
      </div>

      <label class="ctl">
        <span>Section</span>
        <select id="sectionSelect" aria-label="Jump to section"></select>
      </label>
    </div>
  </header>

  <noscript>
    <p style="position:fixed;inset:auto 1rem 1rem;margin:0;padding:0.8rem 1rem;background:#0d0b06;border:1px solid #e4c15a;border-radius:0.4rem">
      JavaScript is required for the +AI opening crawl.
    </p>
  </noscript>

  <!--
    Specification translations. registry.js must load first; each
    spec.<lang>.js then registers itself. Plain <script> tags are deliberate:
    they keep working when this file is opened directly from disk (file://),
    where loading local files over network requests is blocked by the
    browser's cross-origin rules.
  -->
  <script src="translations/registry.js"></script>
  <script src="translations/spec.en.js"></script>
  <script src="translations/spec.ar.js"></script>
  <script src="translations/spec.bn.js"></script>
  <script src="translations/spec.fil.js"></script>
  <script src="translations/spec.fr.js"></script>
  <script src="translations/spec.de.js"></script>
  <script src="translations/spec.ha.js"></script>
  <script src="translations/spec.hi.js"></script>
  <script src="translations/spec.id.js"></script>
  <script src="translations/spec.ja.js"></script>
  <script src="translations/spec.ko.js"></script>
  <script src="translations/spec.zh.js"></script>
  <script src="translations/spec.mr.js"></script>
  <script src="translations/spec.fa.js"></script>
  <script src="translations/spec.pt.js"></script>
  <script src="translations/spec.pa.js"></script>
  <script src="translations/spec.ru.js"></script>
  <script src="translations/spec.es.js"></script>
  <script src="translations/spec.sw.js"></script>
  <script src="translations/spec.ta.js"></script>
  <script src="translations/spec.te.js"></script>
  <script src="translations/spec.th.js"></script>
  <script src="translations/spec.tr.js"></script>
  <script src="translations/spec.ur.js"></script>
  <script src="translations/spec.vi.js"></script>
  <script src="translations/spec.am.js"></script>
  <script src="translations/spec.yue.js"></script>
  <script src="translations/spec.nl.js"></script>
  <script src="translations/spec.el.js"></script>
  <script src="translations/spec.gu.js"></script>
  <script src="translations/spec.he.js"></script>
  <script src="translations/spec.it.js"></script>
  <script src="translations/spec.jv.js"></script>
  <script src="translations/spec.kn.js"></script>
  <script src="translations/spec.ms.js"></script>
  <script src="translations/spec.ml.js"></script>
  <script src="translations/spec.ps.js"></script>
  <script src="translations/spec.pl.js"></script>
  <script src="translations/spec.ro.js"></script>
  <script src="translations/spec.uk.js"></script>

  <script>
    (function () {
      "use strict";

      var SUPPORTED = [
        "en", "ar", "bn", "fil", "fr", "de", "ha", "hi", "id", "ja", "ko", "zh",
        "mr", "fa", "pt", "pa", "ru", "es", "sw", "ta", "te", "th", "tr", "ur", "vi",
        "am", "yue", "nl", "el", "gu", "he", "it", "jv", "kn", "ms", "ml", "ps", "pl", "ro", "uk"
      ];
      var RTL = ["ar", "fa", "ur", "he", "ps"];
      var LEGACY = { iw: "he", in: "id", tl: "fil", mo: "ro" };
      var MIN_DURATION = 25;
      var MAX_DURATION = 240;
      var RATE = 60; // pixels per second at 1x speed

      var registry = window.PlusAISpecTranslations || null;

      var els = {
        stage: document.getElementById("stage"),
        crawlWrap: document.getElementById("crawlWrap"),
        crawl: document.getElementById("crawl"),
        staticWrap: document.getElementById("staticWrap"),
        staticList: document.getElementById("staticList"),
        langSelect: document.getElementById("langSelect"),
        sectionSelect: document.getElementById("sectionSelect"),
        playPause: document.getElementById("playPause"),
        restart: document.getElementById("restart"),
        speeds: Array.prototype.slice.call(document.querySelectorAll(".speed"))
      };

      var state = {
        lang: "en",
        speed: 1,
        playing: true,
        fromSection: null,
        reduced: false
      };

      var motionQuery = window.matchMedia
        ? window.matchMedia("(prefers-reduced-motion: reduce)")
        : null;

      function pad2(value) {
        var s = String(value);
        return s.length < 2 ? "0" + s : s;
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function normalizeLang(value) {
        if (typeof value !== "string") return null;
        var code = value.trim().toLowerCase();
        code = LEGACY[code] || code;
        return SUPPORTED.indexOf(code) >= 0 ? code : null;
      }

      // Resolves a language to the sections/end/heroTitle actually shown, with
      // the reviewed-vs-English fallback the same way the other pages do it.
      function resolvedContent(code) {
        var entry = registry ? registry.get(code) : null;
        var english = registry ? registry.get("en") : null;
        var reviewed = Boolean(entry && entry.status === "reviewed" && entry.sections && entry.sections.length);
        var sections = reviewed ? entry.sections : (english ? english.sections : []);
        var endHtml = (reviewed && entry.end) ? entry.end : (english ? english.end : "");
        var heroTitle = (entry && entry.interfaceCopy && entry.interfaceCopy.heroTitle)
          || (english && english.interfaceCopy && english.interfaceCopy.heroTitle)
          || "AI helped. I take responsibility.";
        var note = (english && english.untranslatedNotice && english.untranslatedNotice.headline)
          || "The specification below is shown in English.";
        return {
          reviewed: reviewed,
          sections: sections,
          endHtml: endHtml,
          heroTitle: heroTitle,
          note: note,
          contentLang: reviewed ? code : "en"
        };
      }

      // Strips a section body (HTML) into plain-text crawl blocks: block
      // closings become line breaks, <li> becomes a bullet, <pre> is kept
      // verbatim, <strong>/<code> keep text only, <h4> becomes a sub-header.
      function bodyToBlocks(html) {
        var blocks = [];
        var root = document.createElement("div");
        root.innerHTML = html || "";

        function inlineText(el) {
          var out = "";
          for (var i = 0; i < el.childNodes.length; i++) {
            var child = el.childNodes[i];
            if (child.nodeType === 3) out += child.nodeValue;
            else if (child.nodeType === 1) {
              out += child.tagName.toLowerCase() === "br" ? "\n" : inlineText(child);
            }
          }
          return out.replace(/[ \t]+/g, " ").replace(/ *\n */g, "\n").trim();
        }

        function push(text, type) {
          if (text) blocks.push({ type: type, text: text });
        }

        function walk(node) {
          for (var i = 0; i < node.childNodes.length; i++) {
            var child = node.childNodes[i];
            if (child.nodeType === 3) {
              push(child.nodeValue.replace(/\s+/g, " ").trim(), "p");
              continue;
            }
            if (child.nodeType !== 1) continue;
            var tag = child.tagName.toLowerCase();

            if (tag === "pre") {
              push(child.textContent.replace(/\r\n?/g, "\n").replace(/^\n+|\n+$/g, ""), "pre");
              continue;
            }
            if (tag === "ul" || tag === "ol") {
              for (var j = 0; j < child.children.length; j++) {
                var li = child.children[j];
                if (li.tagName.toLowerCase() === "li") {
                  push(li.textContent.replace(/\s+/g, " ").trim(), "li");
                }
              }
              continue;
            }
            if (tag === "h4") {
              push(child.textContent.replace(/\s+/g, " ").trim(), "sub");
              continue;
            }
            if (tag === "p" || tag === "blockquote" || tag === "div") {
              push(inlineText(child), "p");
              continue;
            }
            walk(child);
          }
        }

        walk(root);
        return blocks;
      }

      function buildBlocks(code, fromSection) {
        var content = resolvedContent(code);
        var blocks = [];

        if (!fromSection) {
          blocks.push({ type: "title", text: "+AI" });
        }
        if (!content.reviewed) {
          blocks.push({ type: "note", text: content.note });
        }

        var started = !fromSection;
        for (var i = 0; i < content.sections.length; i++) {
          var section = content.sections[i];
          if (!started && String(section.number) === String(fromSection)) started = true;
          if (!started) continue;
          blocks.push({
            type: "head",
            text: "SECTION " + pad2(section.number) + " — " + section.title.toUpperCase()
          });
          var bodyBlocks = bodyToBlocks(section.body);
          for (var b = 0; b < bodyBlocks.length; b++) blocks.push(bodyBlocks[b]);
        }

        var endBlocks = bodyToBlocks(content.endHtml);
        for (var e = 0; e < endBlocks.length; e++) {
          blocks.push({ type: "endline", text: endBlocks[e].text });
        }
        blocks.push({ type: "final", text: content.heroTitle });

        return { blocks: blocks, contentLang: content.contentLang };
      }

      function classFor(type) {
        switch (type) {
          case "title": return "title-card";
          case "head": return "crawl-head";
          case "sub": return "crawl-sub";
          case "li": return "crawl-li";
          case "pre": return "crawl-pre";
          case "note": return "crawl-note";
          case "final": return "crawl-final";
          case "endline": return "crawl-end";
          default: return "crawl-p";
        }
      }

      function renderBlocksInto(container, blocks) {
        container.textContent = "";
        var fragment = document.createDocumentFragment();
        for (var i = 0; i < blocks.length; i++) {
          var block = blocks[i];
          var el = document.createElement("div");
          el.className = "crawl-block " + classFor(block.type);
          el.textContent = block.type === "li" ? "\u00B7 " + block.text : block.text;
          if (block.type === "pre") el.setAttribute("dir", "ltr");
          fragment.appendChild(el);
        }
        container.appendChild(fragment);
      }

      function computeDuration() {
        var travel = els.crawl.offsetHeight + window.innerHeight;
        return clamp(travel / RATE / state.speed, MIN_DURATION, MAX_DURATION);
      }

      function restartCrawl() {
        if (state.reduced) return;
        var duration = computeDuration();
        els.crawl.style.animation = "none";
        void els.crawl.offsetWidth; // force reflow so the animation restarts
        els.crawl.style.setProperty("--duration", duration + "s");
        els.crawl.style.animation = "crawl var(--duration, 120s) linear forwards";
        els.crawl.style.animationPlayState = state.playing ? "running" : "paused";
      }

      function buildLangSelect() {
        for (var i = 0; i < SUPPORTED.length; i++) {
          var code = SUPPORTED[i];
          var entry = registry ? registry.get(code) : null;
          var option = document.createElement("option");
          option.value = code;
          option.textContent = (entry && entry.endonym) ? entry.endonym : code;
          els.langSelect.appendChild(option);
        }
      }

      function rebuildSectionSelect() {
        var content = resolvedContent(state.lang);
        els.sectionSelect.textContent = "";
        var first = document.createElement("option");
        first.value = "";
        first.textContent = "Opening title";
        els.sectionSelect.appendChild(first);
        for (var i = 0; i < content.sections.length; i++) {
          var section = content.sections[i];
          var option = document.createElement("option");
          option.value = String(section.number);
          option.textContent = "SECTION " + pad2(section.number) + " — " + section.title;
          els.sectionSelect.appendChild(option);
        }
        els.sectionSelect.value = state.fromSection ? String(state.fromSection) : "";
      }

      function setPlaying(next) {
        state.playing = next;
        if (!state.reduced) {
          els.crawl.style.animationPlayState = state.playing ? "running" : "paused";
        }
        updatePlayButton();
      }

      function updatePlayButton() {
        els.playPause.textContent = state.playing ? "Pause" : "Play";
        els.playPause.setAttribute("aria-label", state.playing ? "Pause the crawl" : "Play the crawl");
      }

      function updateSpeedButtons() {
        for (var i = 0; i < els.speeds.length; i++) {
          var on = Number(els.speeds[i].getAttribute("data-speed")) === state.speed;
          els.speeds[i].classList.toggle("active", on);
          els.speeds[i].setAttribute("aria-pressed", on ? "true" : "false");
        }
      }

      function setSpeed(speed) {
        state.speed = speed;
        updateSpeedButtons();
        if (!state.reduced) restartCrawl();
      }

      function stepSpeed(delta) {
        var speeds = [0.5, 1, 1.5];
        var index = speeds.indexOf(state.speed);
        if (index < 0) index = 1;
        var next = clamp(index + delta, 0, speeds.length - 1);
        if (speeds[next] !== state.speed) setSpeed(speeds[next]);
      }

      function render(fromSection) {
        state.fromSection = fromSection || null;
        var built = buildBlocks(state.lang, state.fromSection);
        var dir = RTL.indexOf(built.contentLang) >= 0 ? "rtl" : "ltr";
        document.documentElement.lang = built.contentLang;
        document.documentElement.dir = dir;

        if (state.reduced) {
          els.crawlWrap.hidden = true;
          els.staticWrap.hidden = false;
          els.staticList.dir = dir;
          renderBlocksInto(els.staticList, built.blocks);
          els.staticWrap.scrollTop = 0;
        } else {
          els.staticWrap.hidden = true;
          els.crawlWrap.hidden = false;
          els.crawl.dir = dir;
          renderBlocksInto(els.crawl, built.blocks);
          restartCrawl();
        }

        rebuildSectionSelect();
        updateSpeedButtons();
        updatePlayButton();
      }

      // -------------------------------------------------------------- events

      els.langSelect.addEventListener("change", function () {
        state.lang = els.langSelect.value;
        render(null);
      });

      els.sectionSelect.addEventListener("change", function () {
        render(els.sectionSelect.value || null);
      });

      els.playPause.addEventListener("click", function () {
        if (!state.reduced) setPlaying(!state.playing);
      });

      els.restart.addEventListener("click", function () {
        render(state.fromSection);
      });

      for (var s = 0; s < els.speeds.length; s++) {
        els.speeds[s].addEventListener("click", function () {
          setSpeed(Number(this.getAttribute("data-speed")));
        });
      }

      var hoverPaused = false;
      els.stage.addEventListener("mouseenter", function () {
        if (!state.reduced && state.playing) {
          hoverPaused = true;
          setPlaying(false);
        }
      });
      els.stage.addEventListener("mouseleave", function () {
        if (hoverPaused) {
          hoverPaused = false;
          setPlaying(true);
        }
      });

      document.addEventListener("keydown", function (event) {
        var target = event.target;
        if (target && (target.tagName === "SELECT" || target.tagName === "INPUT" || target.tagName === "TEXTAREA")) {
          return;
        }
        if (event.code === "Space") {
          event.preventDefault();
          if (!state.reduced) setPlaying(!state.playing);
        } else if (event.code === "KeyR") {
          render(state.fromSection);
        } else if (event.code === "ArrowLeft") {
          stepSpeed(-1);
        } else if (event.code === "ArrowRight") {
          stepSpeed(1);
        }
      });

      var resizeTimer = null;
      window.addEventListener("resize", function () {
        if (resizeTimer) clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
          if (!state.reduced) restartCrawl();
        }, 200);
      });

      if (motionQuery) {
        var applyReducedMotion = function (event) {
          state.reduced = event.matches;
          document.documentElement.classList.toggle("reduced", state.reduced);
          render(state.fromSection);
        };
        state.reduced = motionQuery.matches;
        if (motionQuery.addEventListener) motionQuery.addEventListener("change", applyReducedMotion);
        else if (motionQuery.addListener) motionQuery.addListener(applyReducedMotion);
      }

      // ---------------------------------------------------------------- boot

      document.documentElement.classList.toggle("reduced", state.reduced);
      buildLangSelect();

      var parameters = new URLSearchParams(window.location.search);
      var urlLang = normalizeLang(parameters.get("lang") || parameters.get("language"));
      state.lang = urlLang || "en";
      els.langSelect.value = state.lang;

      render(null);

      if (!state.reduced && document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () {
          restartCrawl();
        });
      }
    })();
  </script>
</body>
</html>
