<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0a0c0f">
  <meta name="description" content="+AI RSVP — read the entire +AI specification one word at a time at adjustable speed.">
  <title>+AI — RSVP Player</title>
  <script>
    // Set the theme before first paint so ?theme=light has no flash. Dark is the default.
    (function () {
      var theme = "dark";
      try {
        var requested = new URLSearchParams(window.location.search).get("theme");
        if (requested && requested.toLowerCase() === "light") theme = "light";
      } catch (e) { /* keep dark */ }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <!-- Optional font; degrades gracefully to system fonts when offline. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
  <style>
    :root {
      --bg: #0a0c0f;
      --surface: #12151a;
      --surface-2: #181c22;
      --line: #242b33;
      --ink: #e8edf2;
      --muted: #8b97a3;
      --accent: #2FD4FF;
      --accent-soft: rgba(47, 212, 255, 0.12);
      --on-accent: #05222b;
      --orp: #ff4d5e;
      --font: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, Helvetica, Arial, "Noto Sans", "Noto Sans Arabic",
        "Noto Sans Hebrew", "Noto Sans SC", "Noto Sans JP", "Noto Sans KR", sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    :root[data-theme="light"] {
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-2: #eef1f4;
      --line: #d7dee5;
      --ink: #14181d;
      --muted: #5c6772;
      --accent: #0891b2;
      --accent-soft: rgba(8, 145, 178, 0.12);
      --on-accent: #ffffff;
      --orp: #d92b3e;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-width: 18rem;
      color: var(--ink);
      background: var(--bg);
      font-family: var(--font);
      text-rendering: optimizeLegibility;
    }

    button, select { font: inherit; color: inherit; }

    button {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 0.6rem;
      cursor: pointer;
    }

    button:hover { border-color: var(--accent); }

    :focus-visible {
      outline: 0.15rem solid var(--accent);
      outline-offset: 0.15rem;
    }

    .app {
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      padding: 0.8rem 1.25rem;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .wordmark {
      font-weight: 800;
      letter-spacing: -0.06em;
      font-size: 1.3rem;
      line-height: 1;
    }

    .wordmark .accent { color: var(--accent); }

    .wordmark .tag {
      margin-left: 0.5rem;
      padding: 0.12rem 0.45rem;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 0.4rem;
      font-family: var(--mono);
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      vertical-align: 0.2em;
    }

    .langwrap {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
    }

    .langwrap select {
      min-height: 2.2rem;
      padding: 0.3rem 0.6rem;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 0.6rem;
      font-family: var(--font);
    }

    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: min(100%, 52rem);
      margin-inline: auto;
      padding: clamp(1rem, 4vh, 3rem) 1.25rem;
      text-align: center;
    }

    .reader { width: 100%; }

    .section-indicator {
      min-height: 1.4rem;
      margin-bottom: 1.25rem;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.78rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .word-display {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 12rem;
      margin-bottom: 1rem;
      padding: 1.5rem 1rem;
      font-size: clamp(2.6rem, 9vw, 5.5rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.05;
      word-break: break-word;
    }

    .word-display .is-header {
      font-size: clamp(1.3rem, 4.4vw, 2.4rem);
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.01em;
    }

    .word-display .orp { color: var(--orp); }

    .meta {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 0.9rem;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.74rem;
      letter-spacing: 0.04em;
    }

    .progress {
      width: min(100%, 40rem);
      height: 0.22rem;
      margin: 0 auto 1.4rem;
      background: var(--surface-2);
      border-radius: 1rem;
      overflow: hidden;
    }

    .progress span {
      display: block;
      width: 0;
      height: 100%;
      background: var(--accent);
      transition: width 90ms linear;
    }

    .fallback-note {
      max-width: 34rem;
      margin: 0 auto 1.2rem;
      padding: 0.6rem 0.9rem;
      color: var(--muted);
      background: var(--accent-soft);
      border: 1px solid var(--line);
      border-radius: 0.6rem;
      font-size: 0.85rem;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 0.6rem;
    }

    .btn {
      min-height: 2.5rem;
      padding: 0.5rem 0.95rem;
      font-family: var(--mono);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .btn.primary {
      color: var(--on-accent);
      background: var(--accent);
      border-color: var(--accent);
    }

    .btn.primary:hover { border-color: var(--accent); }

    .btn.play {
      min-width: 6rem;
      font-size: 0.9rem;
    }

    .group {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .group .btn { min-width: 2.3rem; padding: 0.5rem 0.6rem; }

    .readout {
      min-width: 4.4rem;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.74rem;
      text-align: center;
    }

    .section-controls .select-wrap { display: inline-flex; }

    .section-controls select {
      min-height: 2.5rem;
      max-width: 20rem;
      padding: 0.4rem 0.7rem;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 0.6rem;
      font-family: var(--font);
    }

    .help {
      margin: 0.9rem 0 0;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.03em;
      line-height: 1.6;
    }

    .endcard {
      width: 100%;
    }

    .endcard .sign {
      margin-bottom: 1rem;
      color: var(--accent);
      font-family: var(--mono);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.34em;
      text-transform: uppercase;
    }

    .endcard .mark {
      font-size: clamp(3.5rem, 14vw, 7.5rem);
      font-weight: 800;
      letter-spacing: -0.06em;
      line-height: 1;
      color: var(--accent);
    }

    .endcard .hero {
      margin: 1.6rem 0 2rem;
      font-size: clamp(1.3rem, 4vw, 2rem);
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    [hidden] { display: none !important; }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <span class="wordmark"><span class="accent">+AI</span><span class="tag">RSVP</span></span>
      <label class="langwrap">
        <span>Language</span>
        <select id="langSelect" aria-label="Choose language"></select>
      </label>
    </header>

    <main class="stage">
      <div id="reader" class="reader">
        <div class="section-indicator" id="sectionIndicator" aria-live="off">Ready</div>
        <div class="word-display" id="wordDisplay" aria-live="polite" aria-label="Reading display" dir="auto"></div>
        <div class="meta">
          <span id="counter">word 0 of 0</span>
          <span id="speedValue">400 WPM</span>
        </div>
        <div class="progress" aria-hidden="true"><span id="progressFill"></span></div>
        <div class="fallback-note" id="fallbackNote" hidden></div>

        <div class="controls">
          <button class="btn play primary" id="playPause" type="button" aria-label="Play">Play</button>
          <div class="group" aria-label="Speed control">
            <button class="btn" id="speedDown" type="button" aria-label="Slower, minus 10 words per minute">−10</button>
            <span class="readout" id="speedValue2" aria-hidden="true">400 WPM</span>
            <button class="btn" id="speedUp" type="button" aria-label="Faster, plus 10 words per minute">+10</button>
          </div>
        </div>

        <div class="controls section-controls">
          <button class="btn" id="prevSection" type="button" aria-label="Previous section">◀ Prev</button>
          <div class="select-wrap">
            <select id="sectionSelect" aria-label="Choose section"></select>
          </div>
          <button class="btn" id="nextSection" type="button" aria-label="Next section">Next ▶</button>
        </div>

        <p class="help">
          Space play/pause · ← → speed · PageUp/PageDown section
        </p>
      </div>

      <div class="endcard" id="endCard" hidden>
        <div class="sign">Signed</div>
        <div class="mark">+AI</div>
        <div class="hero" id="endHero">AI helped. I take responsibility.</div>
        <button class="btn primary" id="playAgain" type="button">Play again</button>
      </div>
    </main>
  </div>

  <div class="sr-only" id="announcer" aria-live="polite"></div>

  <!--
    Specification translations.
    registry.js loads first; each spec.<lang>.js then registers itself.
    Plain <script> tags are deliberate: they work when this file is opened
    directly from disk (file://), where fetch()/import of local files is
    blocked by the browser's cross-origin rules.
  -->
  <script src="translations/registry.js"></script>
  <script src="translations/spec.en.js"></script>
  <script src="translations/spec.ar.js"></script>
  <script src="translations/spec.bn.js"></script>
  <script src="translations/spec.fil.js"></script>
  <script src="translations/spec.fr.js"></script>
  <script src="translations/spec.de.js"></script>
  <script src="translations/spec.ha.js"></script>
  <script src="translations/spec.hi.js"></script>
  <script src="translations/spec.id.js"></script>

  <script src="translations/spec.ta.js"></script>
  <script src="translations/spec.te.js"></script>
  <script src="translations/spec.th.js"></script>
  <script src="translations/spec.tr.js"></script>
  <script src="translations/spec.ur.js"></script>
  <script src="translations/spec.vi.js"></script>
  <script src="translations/spec.am.js"></script>
  <script src="translations/spec.yue.js"></script>
  <script src="translations/spec.nl.js"></script>
  <script src="translations/spec.el.js"></script>
  <script src="translations/spec.gu.js"></script>
  <script src="translations/spec.he.js"></script>
  <script src="translations/spec.it.js"></script>
  <script src="translations/spec.jv.js"></script>
  <script src="translations/spec.kn.js"></script>
  <script src="translations/spec.ms.js"></script>
  <script src="translations/spec.ml.js"></script>
  <script src="translations/spec.ps.js"></script>
  <script src="translations/spec.pl.js"></script>
  <script src="translations/spec.ro.js"></script>
  <script src="translations/spec.uk.js"></script>

  <script>
    (function () {
      "use strict";

      var registry = window.PlusAISpecTranslations || null;

      // Same order as the <script> tags above (and website-v13.html).
      var CODES = [
        "en", "ar", "bn", "fil", "fr", "de", "ha", "hi", "id", "ja", "ko", "zh",
        "mr", "fa", "pt", "pa", "ru", "es", "sw", "ta", "te", "th", "tr", "ur", "vi",
        "am", "yue", "nl", "el", "gu", "he", "it", "jv", "kn", "ms", "ml", "ps", "pl", "ro", "uk"
      ];

      var RTL = { ar: true, fa: true, ur: true, he: true, ps: true };
      var CJK = { zh: true, ja: true, ko: true, yue: true };

      var ENGLISH_NAMES = {
        en: "English", ar: "Arabic", bn: "Bengali", fil: "Filipino", fr: "French",
        de: "German", ha: "Hausa", hi: "Hindi", id: "Indonesian", ja: "Japanese",
        ko: "Korean", zh: "Mandarin", mr: "Marathi", fa: "Persian", pt: "Portuguese",
        pa: "Punjabi", ru: "Russian", es: "Spanish", sw: "Swahili", ta: "Tamil",
        te: "Telugu", th: "Thai", tr: "Turkish", ur: "Urdu", vi: "Vietnamese",
        am: "Amharic", yue: "Cantonese", nl: "Dutch", el: "Greek", gu: "Gujarati",
        he: "Hebrew", it: "Italian", jv: "Javanese", kn: "Kannada", ms: "Malay",
        ml: "Malayalam", ps: "Pashto", pl: "Polish", ro: "Romanian", uk: "Ukrainian"
      };

      var MIN_WPM = 10;
      var MAX_WPM = 1000;
      var DEFAULT_WPM = 400;
      var HEADER_DELAY = 1100; // ms a section banner stays up

      var els = {
        langSelect: document.getElementById("langSelect"),
        sectionSelect: document.getElementById("sectionSelect"),
        sectionIndicator: document.getElementById("sectionIndicator"),
        wordDisplay: document.getElementById("wordDisplay"),
        counter: document.getElementById("counter"),
        speedValue: document.getElementById("speedValue"),
        speedValue2: document.getElementById("speedValue2"),
        progressFill: document.getElementById("progressFill"),
        fallbackNote: document.getElementById("fallbackNote"),
        playPause: document.getElementById("playPause"),
        speedDown: document.getElementById("speedDown"),
        speedUp: document.getElementById("speedUp"),
        prevSection: document.getElementById("prevSection"),
        nextSection: document.getElementById("nextSection"),
        reader: document.getElementById("reader"),
        endCard: document.getElementById("endCard"),
        endHero: document.getElementById("endHero"),
        playAgain: document.getElementById("playAgain"),
        announcer: document.getElementById("announcer")
      };

      var state = {
        lang: "en",
        wpm: DEFAULT_WPM,
        playing: false,
        ended: false,
        section: "1",
        tokens: [],
        chunks: [],
        chunkIndex: 0,
        tokenPos: 0,
        sections: [],
        sectionStartIds: {},
        shownInEnglish: false,
        heroTitle: "AI helped. I take responsibility.",
        timer: null
      };

      // ---- text helpers ---------------------------------------------------

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      function decodeEntities(value) {
        return String(value)
          .replace(/&nbsp;/g, " ")
          .replace(/&lt;/g, "<")
          .replace(/&gt;/g, ">")
          .replace(/&quot;/g, '"')
          .replace(/&#39;|&apos;/g, "'")
          .replace(/&amp;/g, "&");
      }

      // Strips HTML to plain text: block closings and <br> become line breaks,
      // <li>/<h4> get a bullet/newline prefix, <strong>/<code> keep text only,
      // and <pre> content is preserved verbatim (e.g. the section 17 JSON).
      function htmlToText(html) {
        var src = html || "";
        var preBlocks = [];

        var s = src.replace(/<pre\b[^>]*>([\s\S]*?)<\/pre>/gi, function (match, inner) {
          var index = preBlocks.length;
          preBlocks.push(inner.replace(/<\/?code[^>]*>/gi, "").replace(/\r\n/g, "\n"));
          return "\uE000" + index + "\uE001";
        });

        s = s.replace(/<br\s*\/?>/gi, "\n");
        s = s.replace(/<li\b[^>]*>/gi, "\u2022 ");
        s = s.replace(/<h4\b[^>]*>/gi, "\n");
        s = s.replace(/<\/(p|li|h4|blockquote|div)\s*>/gi, "\n");
        s = s.replace(/<[^>]*>/g, "");
        s = decodeEntities(s);

        // Normalise whitespace while the <pre> placeholders are still hidden.
        s = s.replace(/[ \t]+/g, " ");
        s = s.replace(/ *\n */g, "\n");
        s = s.replace(/\n{3,}/g, "\n\n");

        // Restore verbatim <pre> content on its own lines.
        s = s.replace(/\uE000(\d+)\uE001/g, function (match, index) {
          return "\n" + preBlocks[+index] + "\n";
        });

        return s.replace(/\n{3,}/g, "\n\n").trim();
      }

      var CJK_RE = /[\u3001-\u303f\uff01-\uff5e]/;
      try {
        CJK_RE = new RegExp(
          "[\\u3001-\\u303f\\uff01-\\uff5e]|\\p{Script=Han}|\\p{Script=Hiragana}|\\p{Script=Katakana}|\\p{Script=Hangul}",
          "u"
        );
      } catch (e) {
        CJK_RE = /[\u3001-\u303f\uff01-\uff5e\u3040-\u309f\u30a0-\u30ff\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\uac00-\ud7af]/;
      }

      function isCJKChar(ch) {
        return CJK_RE.test(ch);
      }

      // CJK scripts have no spaces: present characters (grouped into pairs
      // where possible), while keeping embedded Latin runs ("+AI", "0.1") as
      // whole tokens.
      function tokenizeCJK(text) {
        var units = Array.from(text);
        var tokens = [];
        var word = "";
        var cjk = "";

        function flushWord() {
          if (word) tokens.push(word);
          word = "";
        }
        function flushCjk() {
          if (cjk) tokens.push(cjk);
          cjk = "";
        }

        for (var i = 0; i < units.length; i++) {
          var ch = units[i];
          if (/\s/.test(ch)) { flushCjk(); flushWord(); continue; }
          if (isCJKChar(ch)) {
            flushWord();
            cjk += ch;
            if (Array.from(cjk).length >= 2) flushCjk();
          } else {
            flushCjk();
            word += ch;
          }
        }
        flushCjk();
        flushWord();
        return tokens;
      }

      function tokenize(text, cjkMode) {
        if (!text) return [];
        if (!cjkMode) {
          return text.split(/\s+/).filter(function (t) { return t.length > 0; });
        }
        return tokenizeCJK(text);
      }

      // ---- Optimal Recognition Point --------------------------------------

      function orpIndex(text) {
        var len = Array.from(text).length;
        if (len <= 2) return 0; // 1-2 letter words: highlight the first
        return Math.min(Math.max(Math.round(len * 0.3), 0), len - 1);
      }

      function withOrp(text, index) {
        var chars = Array.from(text);
        if (index < 0 || index >= chars.length) return escapeHtml(text);
        var out = "";
        for (var i = 0; i < chars.length; i++) {
          out += i === index
            ? '<span class="orp">' + escapeHtml(chars[i]) + "</span>"
            : escapeHtml(chars[i]);
        }
        return out;
      }

      // ---- stream construction --------------------------------------------

      function buildStream(code) {
        var entry = registry ? registry.get(code) : null;
        var english = registry ? registry.get("en") : null;

        var reviewed = Boolean(entry && entry.status === "reviewed" && entry.sections && entry.sections.length);
        var sections = reviewed ? entry.sections : (english ? english.sections : []);
        var endHtml = (reviewed && entry.end) ? entry.end : (english ? english.end : "");
        var heroTitle = (entry && entry.interfaceCopy && entry.interfaceCopy.heroTitle) ||
          (english && english.interfaceCopy && english.interfaceCopy.heroTitle) ||
          "AI helped. I take responsibility.";

        state.sections = sections;
        state.shownInEnglish = !reviewed;
        state.heroTitle = heroTitle;

        var cjkMode = Boolean(CJK[code]);
        var tokens = [];

        sections.forEach(function (section) {
          tokens.push({
            id: tokens.length,
            text: "SECTION " + section.number + " — " + section.title,
            section: section.number,
            isHeader: true,
            isEnd: false
          });
          tokenize(htmlToText(section.body), cjkMode).forEach(function (t) {
            tokens.push({
              id: tokens.length,
              text: t,
              section: section.number,
              isHeader: false,
              isEnd: false
            });
          });
        });

        tokenize(htmlToText(endHtml), cjkMode).forEach(function (t) {
          tokens.push({
            id: tokens.length,
            text: t,
            section: null,
            isHeader: false,
            isEnd: true
          });
        });

        state.tokens = tokens;

        var starts = {};
        tokens.forEach(function (t) {
          if (t.isHeader && t.section) starts[t.section] = t.id;
        });
        state.sectionStartIds = starts;
      }

      // Single-word mechanism only: every token is its own chunk. The chunk
      // layer is kept as a thin 1:1 mapping so rendering, progress and
      // section tracking stay untouched.
      function buildChunks() {
        state.chunks = state.tokens.map(function (token) { return [token]; });
      }

      function syncChunkFromPos() {
        buildChunks();
        state.chunkIndex = clamp(state.tokenPos, 0, state.chunks.length - 1);
        state.tokenPos = state.chunkIndex;
      }

      // ---- rendering ------------------------------------------------------

      function renderChunk(chunk, cjkMode) {
        if (chunk.length === 1 && chunk[0].isHeader) {
          return '<span class="is-header">' + escapeHtml(chunk[0].text) + "</span>";
        }
        var separator = cjkMode ? "" : " ";
        var middle = Math.floor(chunk.length / 2);
        return chunk.map(function (token, index) {
          if (index === middle) return withOrp(token.text, orpIndex(token.text));
          return escapeHtml(token.text);
        }).join(separator);
      }

      function currentSectionNumber() {
        if (!state.chunks.length || !state.chunks[state.chunkIndex]) return null;
        var chunk = state.chunks[state.chunkIndex];
        for (var i = 0; i < chunk.length; i++) {
          if (chunk[i].section) return chunk[i].section;
        }
        return null;
      }

      function render() {
        if (!state.chunks.length || !state.chunks[state.chunkIndex]) {
          els.wordDisplay.innerHTML = "";
          els.counter.textContent = "word 0 of 0";
          els.progressFill.style.width = "0%";
          return;
        }

        var chunk = state.chunks[state.chunkIndex];
        els.wordDisplay.innerHTML = renderChunk(chunk, Boolean(CJK[state.lang]));

        var first = chunk[0];
        var total = state.tokens.length;
        els.counter.textContent = "word " + (first.id + 1) + " of " + total;
        els.progressFill.style.width = (total ? ((first.id + 1) / total) * 100 : 0) + "%";

        // Keep the section select in step with what is on screen right now.
        var sectionNumber = currentSectionNumber();
        if (sectionNumber && sectionNumber !== state.section) {
          state.section = sectionNumber;
          els.sectionSelect.value = sectionNumber;
          announceSection(sectionNumber);
        }

        if (sectionNumber) {
          var section = state.sections.find(function (s) { return s.number === sectionNumber; });
          els.sectionIndicator.textContent = "Section " + sectionNumber +
            (section ? " — " + section.title : "");
        } else if (chunk[chunk.length - 1].isEnd) {
          els.sectionIndicator.textContent = "Signing — +AI";
        } else {
          els.sectionIndicator.textContent = "Ready";
        }

        els.wordDisplay.setAttribute("aria-live", state.playing ? "off" : "polite");
      }

      function updateControls() {
        els.playPause.textContent = state.playing ? "Pause" : "Play";
        els.playPause.setAttribute("aria-label", state.playing ? "Pause playback" : "Play");
        var wpmText = state.wpm + " WPM";
        els.speedValue.textContent = wpmText;
        els.speedValue2.textContent = wpmText;
        els.speedValue2.setAttribute("aria-hidden", "true");
        if (state.section) els.sectionSelect.value = state.section;
      }

      function announceSection(number) {
        var section = state.sections.find(function (s) { return s.number === number; });
        announce("Section " + number + (section ? ", " + section.title : "") + ".");
      }

      function announce(message) {
        els.announcer.textContent = "";
        window.requestAnimationFrame(function () {
          els.announcer.textContent = message;
        });
      }

      function updateFallbackNote() {
        if (state.shownInEnglish) {
          var entry = registry ? registry.get(state.lang) : null;
          var english = registry ? registry.get("en") : null;
          els.fallbackNote.textContent =
            (entry && entry.untranslatedNotice && entry.untranslatedNotice.headline) ||
            (english && english.untranslatedNotice && english.untranslatedNotice.headline) ||
            "The specification below is shown in English.";
          els.fallbackNote.hidden = false;
        } else {
          els.fallbackNote.hidden = true;
        }
      }

      // ---- scheduling -----------------------------------------------------

      function stopTimer() {
        if (state.timer) { clearTimeout(state.timer); state.timer = null; }
      }

      function schedule() {
        stopTimer();
        if (!state.playing) return;
        var chunk = state.chunks[state.chunkIndex];
        var isHeader = chunk && chunk.length === 1 && chunk[0].isHeader;
        // One word per step: 60000/wpm ms per token (headers pause longer).
        var delay = isHeader ? HEADER_DELAY : (60000 / state.wpm);
        state.timer = setTimeout(function () {
          advance();
          if (state.playing) schedule();
        }, delay);
      }

      function advance() {
        if (state.chunkIndex >= state.chunks.length - 1) {
          state.playing = false;
          finish();
          return;
        }
        state.chunkIndex += 1;
        state.tokenPos = state.chunks[state.chunkIndex][0].id;
        render();
        updateControls();
      }

      function finish() {
        state.ended = true;
        stopTimer();
        els.endHero.textContent = state.heroTitle;
        els.reader.hidden = true;
        els.endCard.hidden = false;
        announce(state.heroTitle + ". Playback complete.");
        updateControls();
      }

      function resetToStart() {
        state.ended = false;
        state.tokenPos = 0;
        state.chunkIndex = 0;
        els.reader.hidden = false;
        els.endCard.hidden = true;
        render();
        updateControls();
      }

      function togglePlay() {
        if (!state.tokens.length) return;
        if (state.ended) {
          resetToStart();
          state.playing = true;
          schedule();
          render();
          updateControls();
          return;
        }
        state.playing = !state.playing;
        if (state.playing) {
          schedule();
          announce("Playing.");
        } else {
          stopTimer();
          announce("Paused.");
        }
        render();
        updateControls();
      }

      // ---- controls -------------------------------------------------------

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function adjustWpm(delta) {
        state.wpm = clamp(state.wpm + delta, MIN_WPM, MAX_WPM);
        updateControls();
      }

      function jumpToSection(number) {
        var id = state.sectionStartIds[number];
        state.tokenPos = (id != null) ? id : 0;
        state.section = String(number);
        state.playing = false;
        stopTimer();
        if (state.ended) {
          state.ended = false;
          els.reader.hidden = false;
          els.endCard.hidden = true;
        }
        syncChunkFromPos();
        render();
        updateControls();
        announceSection(String(number));
      }

      function sectionOrder() {
        return state.sections.map(function (s) { return s.number; });
      }

      function prevSection() {
        var order = sectionOrder();
        var index = order.indexOf(state.section);
        if (index <= 0) return;
        jumpToSection(order[index - 1]);
      }

      function nextSection() {
        var order = sectionOrder();
        var index = order.indexOf(state.section);
        if (index < 0 || index >= order.length - 1) return;
        jumpToSection(order[index + 1]);
      }

      // ---- population & init ---------------------------------------------

      function populateLanguages() {
        CODES.forEach(function (code) {
          var entry = registry ? registry.get(code) : null;
          var endonym = entry && entry.endonym ? entry.endonym : "";
          var englishName = ENGLISH_NAMES[code] || code;
          var label = (endonym && endonym.toLowerCase() !== englishName.toLowerCase())
            ? englishName + " / " + endonym
            : englishName;
          var option = document.createElement("option");
          option.value = code;
          option.textContent = label;
          els.langSelect.appendChild(option);
        });
      }

      function populateSections() {
        els.sectionSelect.innerHTML = "";
        state.sections.forEach(function (section) {
          var option = document.createElement("option");
          option.value = section.number;
          option.textContent = "Section " + section.number + " — " + section.title;
          els.sectionSelect.appendChild(option);
        });
        els.sectionSelect.value = state.section || "1";
      }

      function loadLanguage(code) {
        stopTimer();
        state.lang = code;
        state.playing = false;
        state.ended = false;
        els.reader.hidden = false;
        els.endCard.hidden = true;
        document.documentElement.lang = code;

        buildStream(code);
        populateSections();

        // Jump to the section we were on (falls back to 1).
        var target = (state.sectionStartIds[state.section] != null) ? state.section : "1";
        state.tokenPos = state.sectionStartIds[target];
        if (state.tokenPos == null) state.tokenPos = 0;
        state.section = target;

        syncChunkFromPos();
        updateFallbackNote();
        render();
        updateControls();
      }

      function readParams() {
        var params = {};
        try { params.params = new URLSearchParams(window.location.search); } catch (e) { params.params = new URLSearchParams(""); }
        var lang = (params.params.get("lang") || "").trim().toLowerCase();
        params.lang = CODES.indexOf(lang) >= 0 ? lang : "en";
        var section = parseInt(params.params.get("section"), 10);
        params.section = (Number.isInteger(section) && section >= 1 && section <= 26) ? String(section) : "1";
        return params;
      }

      function bindEvents() {
        els.playPause.addEventListener("click", togglePlay);
        els.playAgain.addEventListener("click", function () {
          resetToStart();
          state.playing = true;
          schedule();
          updateControls();
        });
        els.speedDown.addEventListener("click", function () { adjustWpm(-10); });
        els.speedUp.addEventListener("click", function () { adjustWpm(10); });
        els.prevSection.addEventListener("click", prevSection);
        els.nextSection.addEventListener("click", nextSection);
        els.sectionSelect.addEventListener("change", function () {
          jumpToSection(els.sectionSelect.value);
        });
        els.langSelect.addEventListener("change", function () {
          loadLanguage(els.langSelect.value);
        });

        window.addEventListener("keydown", function (event) {
          var target = event.target;
          var tag = target && target.tagName ? target.tagName.toUpperCase() : "";
          if (tag === "SELECT" || tag === "INPUT" || tag === "TEXTAREA") return;
          switch (event.key) {
            case " ":
              event.preventDefault();
              togglePlay();
              break;
            case "ArrowLeft":
              event.preventDefault();
              adjustWpm(-10);
              break;
            case "ArrowRight":
              event.preventDefault();
              adjustWpm(10);
              break;
            case "PageUp":
              event.preventDefault();
              prevSection();
              break;
            case "PageDown":
              event.preventDefault();
              nextSection();
              break;
          }
        });
      }

      function init() {
        populateLanguages();
        bindEvents();
        var params = readParams();
        els.langSelect.value = params.lang;
        state.section = params.section;
        loadLanguage(params.lang);
        announce("RSVP player ready. Press Play to start reading.");
      }

      init();
    })();
  </script>
</body>
</html>
