<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>+AI — Attract Mode</title>
<style>
  :root {
    --accent: #ffb000; /* amber — the single demo accent */
    --ink: #e9e9e2;
    --dim: #a7ad9c;
    --bg: rgba(8, 8, 12, 0.78);
    --bar-h: 3px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    color: var(--ink);
  }
  #stage { position: fixed; inset: 0; overflow: hidden; background: #000; }
  #frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

  /* Status strip: translucent near-black, monospace, arcade demo. */
  .status {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--bg);
    color: var(--ink);
    font-size: 12px; line-height: 1.6;
    pointer-events: none;
    border-top: 1px solid rgba(255, 176, 0, 0.35);
    text-shadow: 0 1px 0 #000;
  }
  .bar-track { height: var(--bar-h); background: rgba(255, 255, 255, 0.12); }
  .bar {
    height: 100%; width: 100%; background: var(--accent);
    transition: width 250ms linear;
  }
  .row {
    display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center;
    padding: 6px 12px 4px;
  }
  .badge {
    display: inline-block; padding: 1px 7px 2px;
    color: #000; background: var(--accent);
    font-weight: 700; letter-spacing: 0.18em; font-size: 11px;
    border-radius: 2px;
  }
  .text { color: var(--ink); }
  .dim { color: var(--dim); }
  .hint { color: var(--dim); letter-spacing: 0.04em; }
  .state { color: var(--accent); }
  .urlrow { display: flex; gap: 8px; align-items: center; padding: 3px 12px 8px; }
  .url {
    flex: 1; color: var(--accent); overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  #copyBtn, #pauseBtn {
    pointer-events: auto; font: inherit; font-size: 11px; color: var(--ink);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 176, 0, 0.4);
    border-radius: 3px; padding: 1px 8px; cursor: pointer;
  }
  #copyBtn:hover, #pauseBtn:hover { background: rgba(255, 176, 0, 0.18); }
</style>
</head>
<body>
  <div id="stage">
    <iframe id="frame" title="+AI attract mode" allow="fullscreen"></iframe>
  </div>
  <div class="status">
    <div class="bar-track" aria-hidden="true"><div class="bar" id="bar"></div></div>
    <div class="row">
      <span class="badge">DEMO</span>
      <span class="text" id="statusText" aria-live="polite"></span>
      <span class="dim" id="clause"></span>
      <span class="state" id="state"></span>
      <span class="dim" id="countdown"></span>
    </div>
    <div class="urlrow">
      <span class="url" id="urlText"></span>
      <button id="copyBtn" type="button">copy URL</button>
      <button id="pauseBtn" type="button">pause</button>
      <span class="hint">SPACE skip · P pause · ←/→ interval</span>
    </div>
  </div>

<script>
    // ===== THEMES — enumerated at build time with the glob tool =====
  // Every +AI specification theme page (site/*.html) is included EXCEPT:
  // toolkit.html, random.html, attract.html, the standalone players
  // (rsvp/narration/credits/crawl/typewriter/slideshow/speedread.html),
  // and the historical website builds (archived under archive/versions/).
  // index.html (the canonical spec page) is kept as a theme.
  const THEMES = [
    "accounting.html", "advertising.html", "aerospace.html", "architecture.html", "art-cubism.html", "art-impressionist.html", "banking.html", "biotech.html",
    "bladerunner2049.html", "blueprint.html", "chemicals.html", "construction.html", "consulting.html", "country-ja.html", "cyberpunk.html", "dec-manual.html",
    "dental.html", "energy.html", "finance.html", "fintech.html", "fitness.html", "games.html", "hal9000.html", "hr.html",
    "ibm-manual.html", "insurance.html", "lcars-mono.html", "legal.html", "luxury.html", "manpage.html",
    "manufacturing.html", "maritime.html", "medical.html", "mentalhealth.html", "military-spec.html", "mining.html", "museum.html", "music.html",
    "neogenesis.html", "newsroom.html", "notary.html", "occupation-ceo.html", "occupation-cfo.html", "occupation-cio.html", "occupation-coo.html", "occupation-cto.html",
    "pharma.html", "quantumlab.html", "realestate.html", "retro.html", "sci-fi-1.html", "sci-fi-2.html", "spaceinvaders.html", "spaceodyssey.html",
    "startrek.html", "starwars.html", "swiss.html", "the-borg.html", "theme-adobe.html", "theme-anthropic.html", "theme-github.html", "theme-google.html",
    "theme-microsoft.html", "theme-openai.html", "theme-youtube.html", "university.html", "utilities.html", "veterinary.html", "index.html",
  ];

  // The 39 non-English language codes (40 total incl. native en).
  const LANG_CODES = [
    "ar", "bn", "fil", "fr", "de", "ha", "hi", "id", "ja", "ko", "zh", "mr", "fa", "pt", "pa", "ru",
    "es", "sw", "ta", "te", "th", "tr", "ur", "vi", "am", "yue", "nl", "el", "gu", "he", "it", "jv",
    "kn", "ms", "ml", "ps", "pl", "ro", "uk"
  ];

  const TOTAL_SECTIONS = 26;
  const STREAK_LENGTH = 4;                 // ~4 sections per theme/mode/language streak
  const INTERVALS = [10000, 20000, 30000, 45000];
  const REDUCED_MOTION =
    window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const DEFAULT_INTERVAL = REDUCED_MOTION ? 45000 : 20000;

  const frame = document.getElementById("frame");
  const bar = document.getElementById("bar");
  const statusText = document.getElementById("statusText");
  const clauseEl = document.getElementById("clause");
  const stateEl = document.getElementById("state");
  const countdownEl = document.getElementById("countdown");
  const urlText = document.getElementById("urlText");
  const copyBtn = document.getElementById("copyBtn");
  const pauseBtn = document.getElementById("pauseBtn");

  // ---- state ----
  let stepCount = 0;               // completed advances; section = (stepCount % 26) + 1
  let currentTheme = null;
  let currentMode = "dark";
  let currentHighlight = "FFB000";
  let currentLang = "en";
  let currentUrl = "";
  let ready = false;
  let paused = false;
  let intervalMs = DEFAULT_INTERVAL;
  let intervalIndex = INTERVALS.indexOf(DEFAULT_INTERVAL);
  let deadline = 0;
  let remainingOnPause = DEFAULT_INTERVAL;
  let autoTimer = null;

  function randomOf(list) { return list[Math.floor(Math.random() * list.length)]; }

  // Random pleasant colour: any hue, saturation 60–85%, lightness 40–55%.
  function hslToHex(h, s, l) {
    s /= 100; l /= 100;
    const k = (n) => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    const to = (x) => Math.round(255 * x).toString(16).padStart(2, "0").toUpperCase();
    return to(f(0)) + to(f(8)) + to(f(4));
  }
  function randomHighlight() {
    const hue = Math.floor(Math.random() * 360);
    const sat = 60 + Math.floor(Math.random() * 26);   // 60–85
    const light = 40 + Math.floor(Math.random() * 16); // 40–55
    return hslToHex(hue, sat, light);
  }

  function pickTheme() {
    let theme;
    do { theme = randomOf(THEMES); } while (theme === currentTheme && THEMES.length > 1);
    return theme;
  }

  function streakNumber() { return Math.floor(stepCount / STREAK_LENGTH) + 1; }
  function currentSection() { return (stepCount % TOTAL_SECTIONS) + 1; }

  // New reading streak: change theme (≠ current), toggle light/dark randomly,
  // pick a random highlight, and alternate English ↔ random non-English.
  function beginNewStreak() {
    currentTheme = pickTheme();
    currentMode = Math.random() < 0.5 ? "light" : "dark";
    currentHighlight = randomHighlight();
    currentLang = streakNumber() % 2 === 1 ? "en" : randomOf(LANG_CODES);
  }

  function buildUrl(theme, lang, mode, highlight, section) {
    return theme +
      "?lang=" + encodeURIComponent(lang) +
      "&theme=" + encodeURIComponent(mode) +
      "&highlight=" + encodeURIComponent(highlight) +
      "#section-" + section;
  }

  function pad(n) { return (n < 10 ? "0" : "") + n; }

  function updateStatus() {
    statusText.textContent =
      currentTheme + " · " + currentLang +
      " · " + currentMode + " · #" + currentHighlight;
    clauseEl.textContent = "CLAUSE " + pad(currentSection()) + " / " + TOTAL_SECTIONS;
    stateEl.textContent = paused ? "❚❚ PAUSED" : (ready ? "● READY" : "● LOADING");
    urlText.textContent = currentUrl;
    pauseBtn.textContent = paused ? "resume" : "pause";
  }

  function loadCurrent() {
    currentUrl = buildUrl(currentTheme, currentLang, currentMode, currentHighlight, currentSection());
    ready = false;
    frame.src = currentUrl;
    updateStatus();
  }

  function onFrameLoad() {
    ready = true;
    updateStatus();
  }

  function resetTimer() {
    clearInterval(autoTimer);
    if (paused) return;
    autoTimer = setInterval(advance, intervalMs);
    deadline = Date.now() + intervalMs;
  }

  function advance() {
    stepCount += 1;
    if (stepCount % STREAK_LENGTH === 0) beginNewStreak(); // new reading streak
    loadCurrent();
    if (!paused) resetTimer();
  }

  function pause() {
    if (paused) return;
    paused = true;
    remainingOnPause = Math.max(0, deadline - Date.now());
    clearInterval(autoTimer);
    updateStatus();
  }

  function resume() {
    if (!paused) return;
    paused = false;
    resetTimer();
    updateStatus();
  }

  function togglePause() { paused ? resume() : pause(); }

  function adjustInterval(dir) {
    intervalIndex = Math.max(0, Math.min(INTERVALS.length - 1, intervalIndex + dir));
    intervalMs = INTERVALS[intervalIndex];
    if (!paused) resetTimer();
    else remainingOnPause = intervalMs;
    updateStatus();
  }

  // ---------- countdown tick (rAF; the bar is the only animation) ----------
  function tick() {
    if (paused) {
      bar.style.width = (remainingOnPause / intervalMs * 100) + "%";
      countdownEl.textContent = "paused · " + (intervalMs / 1000) + "s interval";
    } else {
      const remaining = Math.max(0, deadline - Date.now());
      bar.style.width = (remaining / intervalMs * 100) + "%";
      countdownEl.textContent = "next in " + Math.ceil(remaining / 1000) + "s · " + (intervalMs / 1000) + "s";
    }
    requestAnimationFrame(tick);
  }

  // ---------- keyboard / focus ----------
  function childInteracting() {
    try {
      const el = frame.contentDocument && frame.contentDocument.activeElement;
      return !!el && /^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName);
    } catch (e) { return false; } // blocked on file://: assume not interacting
  }

  window.addEventListener("keydown", function (event) {
    const active = document.activeElement;
    const inForm = active && /^(INPUT|SELECT|TEXTAREA)$/.test(active.tagName);
    if (event.code === "Space") {
      if (active && /^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(active.tagName)) return;
      event.preventDefault();
      advance(); // skip to next step (resets the timer when running)
    } else if (event.code === "KeyP") {
      if (inForm) return;
      event.preventDefault();
      togglePause();
    } else if (event.code === "ArrowLeft") {
      if (inForm) return;
      event.preventDefault();
      adjustInterval(-1);
    } else if (event.code === "ArrowRight") {
      if (inForm) return;
      event.preventDefault();
      adjustInterval(+1);
    }
  });

  // The child iframe steals focus when clicked, swallowing keys. Return focus
  // to the parent so shortcuts keep working — unless the user is inside a
  // child <select>/<input>/<textarea>.
  window.addEventListener("blur", function () {
    if (document.activeElement !== frame) return; // focus left the tab, not the iframe
    if (childInteracting()) return;
    requestAnimationFrame(function () {
      if (document.activeElement === frame && !childInteracting()) {
        window.focus();
      }
    });
  });

  // ---------- buttons ----------
  copyBtn.addEventListener("click", function (event) {
    const url = currentUrl;
    function fallback() {
      try {
        const ta = document.createElement("textarea");
        ta.value = url;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
      } catch (e) {}
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).catch(fallback);
    } else {
      fallback();
    }
    event.currentTarget.blur();
  });

  pauseBtn.addEventListener("click", function (event) {
    togglePause();
    event.currentTarget.blur();
  });

  // ---------- start ----------
  frame.onload = onFrameLoad;
  beginNewStreak(); // streak 1 (odd) → English
  loadCurrent();
  resetTimer();
  requestAnimationFrame(tick);
</script>
</body>
</html>
