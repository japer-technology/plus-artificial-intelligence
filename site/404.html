<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#AC43D9">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <title>404 — +AI</title>
  <style>
    :root { --accent: #AC43D9; --ink: #f6f2fa; --muted: #a89fbd; --paper: #16121d; --surface: #201a2b; --line: #332a45; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif; }
    body {
      min-height: 100vh; min-height: 100dvh;
      display: grid; place-items: center;
      background: radial-gradient(1200px 600px at 50% -10%, #241a33 0%, var(--paper) 55%);
      color: var(--ink); padding: 2rem;
    }
    main { width: min(34rem, 100%); text-align: center; }
    .mark { color: var(--accent); font-weight: 700; letter-spacing: 0.08em; font-size: 0.95rem; text-transform: uppercase; }
    h1 { font-size: clamp(5rem, 22vw, 9rem); line-height: 1; letter-spacing: -0.03em; margin: 1rem 0 0.5rem; }
    p { color: var(--muted); font-size: 1.05rem; line-height: 1.6; }
    blockquote {
      margin: 1.75rem auto; padding: 1.1rem 1.4rem;
      border: 1px solid var(--line); border-radius: 14px;
      background: var(--surface); font-style: italic; font-size: 1.1rem;
    }
    nav { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; margin-top: 2rem; }
    a {
      color: var(--ink); text-decoration: none;
      border: 1px solid var(--line); border-radius: 999px;
      padding: 0.55rem 1.1rem; font-size: 0.9rem;
      transition: border-color .15s ease, color .15s ease, transform .15s ease;
    }
    a:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
  </style>
</head>
<body>
  <main>
    <p class="mark">+AI</p>
    <h1>404</h1>
    <p>This page does not exist — but the promise does.</p>
    <blockquote>AI helped. I take responsibility.</blockquote>
    <nav>
      <a href="/">Home — the +AI specification</a>
      <a href="/toolkit.html">Theme toolkit</a>
      <a href="/random.html">Random theme</a>
    </nav>
  </main>
</body>
</html>
