name: Deploy site

on:
  # This workflow is intentionally manual-only. It does not run for pushes,
  # pull requests, schedules, or any other repository event.
  workflow_dispatch:

permissions:
  id-token: write # GitHub OIDC → AWS
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Translation data validation
        run: node scripts/validate.mjs
      - name: Render smoke test (all 40 languages)
        run: node scripts/render-check.mjs
      - name: Local link check
        run: node scripts/check-links.mjs
      - name: Sitemap and 404 freshness
        run: |
          node scripts/generate-sitemap.mjs
          node scripts/build-404.mjs
          git diff --exit-code -- site/sitemap.xml site/404.html || {
            echo "::error::site/sitemap.xml or site/404.html is stale — run 'node scripts/generate-sitemap.mjs' and 'node scripts/build-404.mjs' and commit the results."
            exit 1
          }

  deploy:
    name: Deploy to S3 + CloudFront
    needs: validate
    runs-on: ubuntu-latest
    # Create this GitHub environment before running the workflow:
    # Settings → Environments → production. Configure these non-secret Actions
    # variables there (environment values override repository-level values):
    #
    # AWS_ROLE_ARN: required IAM role ARN, for example
    #   arn:aws:iam::123456789012:role/github-plus-ai-deploy. Its trust policy
    #   must allow this repository to assume it through GitHub OIDC.
    # AWS_REGION: required AWS region containing the target S3 bucket, for
    #   example us-east-1.
    # S3_BUCKET_NAME: required target bucket name only, without s3://, for
    #   example plus-artificial-intelligence.org.
    # CLOUDFRONT_DISTRIBUTION_ID: required CloudFront distribution ID only,
    #   not its domain name or ARN.
    #
    # No AWS access-key secret is required: configure the values at Settings →
    # Environments → production → Environment variables, then use Actions →
    # Deploy site → Run workflow. See docs/DEPLOYMENT.md for the AWS setup.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Sync site/ to S3
        run: aws s3 sync site/ "s3://${{ vars.S3_BUCKET_NAME }}" --delete --exact-timestamps
      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
