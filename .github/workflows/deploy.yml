name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write # GitHub OIDC → AWS
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Translation data validation
        run: node scripts/validate.mjs
      - name: Render smoke test (all 40 languages)
        run: node scripts/render-check.mjs
      - name: Local link check
        run: node scripts/check-links.mjs
      - name: Sitemap freshness
        run: |
          node scripts/generate-sitemap.mjs
          git diff --exit-code -- site/sitemap.xml || {
            echo "::error::site/sitemap.xml is stale — run 'node scripts/generate-sitemap.mjs' and commit the result."
            exit 1
          }

  deploy:
    name: Deploy to S3 + CloudFront
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Sync site/ to S3
        run: aws s3 sync site/ "s3://${{ vars.S3_BUCKET_NAME }}" --delete --exact-timestamps
      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
